<html lang="zh-Hant">

  <title>M加法展開計算</title>
  <style>
    :root{color-scheme:light;--s900:#0f172a;--s700:#334155;--s600:#475569;--s500:#64748b;--s400:#94a3b8;--s300:#cbd5e1;--s200:#e2e8f0;--s100:#f1f5f9;--pink:#be185d;--green:#047857;--orange:#c2410c}
    *{box-sizing:border-box}html,body{margin:0;min-height:0;background:#e9eef4;color:#111827;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}body{padding:14px}button,input,select{font:inherit}button{cursor:pointer}
    .calculator{width:min(430px,100%);margin:0 auto;border:1px solid #aeb9c8;border-radius:12px;background:#f8fafc;box-shadow:0 18px 46px rgba(15,23,42,.18);overflow:hidden}.head{position:sticky;top:0;z-index:2;padding:14px 16px;border-bottom:1px solid var(--s300);background:var(--s700);color:#fff}.head h1{margin:0;font-size:18px;font-weight:850}.site-version{position:absolute;right:14px;top:50%;color:#cbd5e1;font-size:10px;font-weight:650;opacity:.78;transform:translateY(-50%);white-space:nowrap}.body{padding:14px 16px 16px}
    .context{display:flex;align-items:center;justify-content:center;gap:3px;min-height:34px;margin-bottom:10px;padding:5px 10px 5px 4px;border:1px solid var(--s300);border-radius:7px;background:#fff;color:var(--s600);font-size:12px;font-weight:700;white-space:nowrap}.context-choice{display:inline-flex;align-items:center}.context-choice select{field-sizing:content;width:auto;min-width:52px;max-width:116px;height:24px;padding:0 4px;border:1px solid #2563eb;border-radius:5px;background:#dbeafe;color:#1d4ed8;font-size:12.5px;font-weight:900;appearance:none}.context-choice.material select{min-width:60px}.thickness-control{position:relative;display:inline-flex;width:34px;height:24px}.context-choice #thickness{width:100%;min-width:0;padding:0;border-color:#ea580c;background:#ffedd5;color:transparent;text-align:center}.context-choice #thickness option{color:#111827}.thickness-display{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c2410c;font-weight:900;pointer-events:none}.context-unit{margin-left:2px;color:#111827}.context-radius{display:inline-flex;align-items:center;gap:1px;color:#0369a1;font-weight:850}.context-radius input{width:34px;height:24px;padding:0 3px;border:1px solid #0ea5e9;border-radius:5px;background:#e0f2fe;color:#0369a1;font-size:12.5px;font-weight:900;text-align:center;appearance:textfield;-moz-appearance:textfield}.context-radius input::-webkit-outer-spin-button,.context-radius input::-webkit-inner-spin-button{margin:0;-webkit-appearance:none}.sep{color:var(--s400)}.metric-m{color:var(--pink)}.metric-reverse-m{color:#dc2626}.metric-kf{color:var(--green)}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
    .memory-nav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:8px;margin-bottom:10px}.memory-arrow{width:38px;height:34px;padding:0;border:1px solid var(--s400);border-radius:7px;background:#fff;color:var(--s700);font-size:22px;font-weight:850}.memory-label{color:var(--s700);font-size:13.5px;font-weight:850;text-align:center}
    table{width:100%;border-collapse:collapse;border:2px solid var(--s600);table-layout:fixed}th,td{height:39px;padding:0;border:1px solid var(--s500);vertical-align:middle}th{width:32%;background:var(--s100);color:#1e293b;font-size:14px;font-weight:750;text-align:center}.result{background:#fff56b;font-size:21px;font-weight:900;text-align:center}.folds{background:var(--s200);font-size:16px;font-weight:850;text-align:center}.coefficient-total{background:#fff;color:var(--pink);font-size:16px;font-weight:850;text-align:center}.compensation,.size{width:100%;height:38px;padding:5px 10px;border:0;background:#fff;color:#111827;font-size:16px;font-weight:750;text-align:center}.size{appearance:textfield;-moz-appearance:textfield}.size::-webkit-outer-spin-button,.size::-webkit-inner-spin-button{margin:0;-webkit-appearance:none}.size-heading{line-height:1.05}.zero-value{display:block;margin-top:3px;color:var(--s500);font-size:10px}.t-cell{width:38%;padding:4px;background:#f8fafc}.t-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;border-radius:6px;background:var(--s200)}.t-toggle button{height:27px;padding:0;border:0;border-radius:4px;background:#fff;color:var(--s500);font-size:10.5px;font-weight:800}.t-toggle button.active,.t-toggle button[aria-pressed="true"],[data-size-row][data-t-count="0"] button[data-t-count="0"],[data-size-row][data-t-count="1"] button[data-t-count="1"],[data-size-row][data-t-count="2"] button[data-t-count="2"]{background:var(--s600);color:#fff}.t-toggle .reverse-toggle.active,.t-toggle .reverse-toggle[aria-pressed="true"],[data-size-row][data-reverse="true"] .reverse-toggle{background:#dc2626;color:#fff}
    .add-wrap{display:flex;justify-content:center;margin-top:10px}.add,.change-add{border:1px dashed var(--s400);border-radius:7px;background:#fff;color:var(--s600);font-size:12.5px;font-weight:750}.add{height:36px;padding:0 18px}.change-panel{margin-top:14px;border:1px solid var(--s300);border-radius:8px;background:#fff;overflow:hidden}.change-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--s300);background:var(--s100)}.change-head strong{font-size:14px}.change-add{height:30px;padding:0 10px}.special-empty{padding:10px;color:var(--s500);font-size:12px;text-align:center}.special-row{display:flex;align-items:center;gap:6px;padding:6px;border-top:1px solid var(--s200)}.special-field{display:inline-flex;align-items:center;gap:3px;min-width:0;color:var(--s700);font-size:11.5px;font-weight:750;white-space:nowrap}.special-row input{min-width:0;height:30px;padding:2px 4px;border:1px solid var(--s300);border-radius:5px;background:#fff;font-size:11.5px;text-align:center;appearance:textfield;-moz-appearance:textfield}.special-row input::-webkit-outer-spin-button,.special-row input::-webkit-inner-spin-button{margin:0;-webkit-appearance:none}.angle-field input{width:48px}.radius-field input{width:46px}.coefficient-field{margin-left:auto}.special-coeff{min-width:24px;color:var(--pink);font-size:12px;font-weight:850;text-align:center}.special-remove{flex:0 0 auto;width:auto;height:28px;padding:0 8px;border:1px solid #fecaca;border-radius:5px;background:#fff;color:#dc2626;font-size:11px;font-weight:750;white-space:nowrap}
    .note{min-height:20px;margin:10px 0 0;color:var(--s500);font-size:12px;font-weight:650;text-align:center}.note.error{color:var(--orange)}.actions{display:flex;justify-content:center;gap:9px;margin-top:12px}.actions button{height:38px;padding:0 15px;border:1px solid var(--s300);border-radius:7px;background:#fff;color:var(--s600);font-weight:750}.actions .clear-all{border-color:#fecaca;color:#dc2626}[hidden]{display:none!important}@media(max-width:420px){body{padding:0}.calculator{border:0;border-radius:0;box-shadow:none}.body{padding:12px}.special-row{gap:4px}.special-field{gap:2px;font-size:11px}.angle-field input{width:44px}.radius-field input{width:42px}}
  </style>
</head>
<body>
<main class="calculator">
  <header class="head"><h1>M加法展開計算</h1><span class="site-version" aria-label="網站版次 Version 150 測試">Version 150 測試</span></header>
  <div class="body">
    <div class="context" aria-label="目前M加法計算條件">
      <label class="context-choice material"><span class="sr-only">材質</span><select id="material" aria-label="材質"></select></label><span class="sep">｜</span>
      <label class="context-choice"><span class="sr-only">板厚</span><span class="thickness-control"><select id="thickness" aria-label="板厚"></select><span class="thickness-display" id="thicknessDisplay"></span></span><span class="context-unit">T</span></label><span class="sep">｜</span>
      <label class="context-radius"><span>R</span><input id="defaultRadius" type="number" inputmode="decimal" step="any" min="0" value="0" aria-label="整體預設內R"></label><span class="sep">｜</span>
      <span class="metric-m" id="mMetric">M －</span><span class="sep">｜</span><span class="metric-reverse-m" id="reverseMMetric">反折M －</span><span class="sep">｜</span><span class="metric-kf" id="kfMetric">K-F －</span>
    </div>
    <div class="memory-nav"><button type="button" class="memory-arrow" aria-label="上一組" data-memory="-1">‹</button><div class="memory-label" id="memoryLabel">尺寸組 1／3</div><button type="button" class="memory-arrow" aria-label="下一組" data-memory="1">›</button></div>
    <table aria-label="M加法展開計算表"><tbody id="calcRows">
      <tr><th scope="row">展開計算</th><td colspan="2" class="result" id="result">－</td></tr>
      <tr><th scope="row">折數</th><td colspan="2" class="folds" id="folds">0（預設0／變化0）</td></tr>
      <tr><th scope="row">M係數總和</th><td colspan="2" class="coefficient-total" id="coefficientTotal">0</td></tr>
      <tr><th scope="row">係數補償</th><td colspan="2"><input class="compensation" id="compensation" type="text" inputmode="decimal" autocomplete="off" placeholder="+0.1 / -0.1" aria-label="係數補償"></td></tr>
    </tbody></table>
    <div class="add-wrap" id="addWrap"><button type="button" class="add" id="addRow">＋ 新增尺寸</button></div>
    <section class="change-panel" aria-label="角度與R變化"><div class="change-head"><strong>角度與R變化</strong><button type="button" class="change-add" id="addSpecial">＋ 新增變化</button></div><div id="specialRows"><div class="special-empty">未設定變化，全部以90°及上方內R計算</div></div></section>
    <p class="note" id="note">請至少輸入2個料內尺寸</p>
    <div class="actions"><button type="button" id="clearGroup">清除此組</button><button type="button" class="clear-all" id="clearAll">清除全部</button></div>
  </div>
</main>
<script src="/engineering-coefficients.js"></script>
<script>
const $=id=>document.getElementById(id),COUNT=3,MAX_ROWS=10,BASE_ROWS=6,coefficients=window.EngineeringCoefficients;
const fixed2=new Intl.NumberFormat('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2}),compact2=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
let context={mat:'',thick:'',radius:'0'},memoryIndex=0,applying=false,fitFrame=0,groups=Array.from({length:COUNT},blankGroup);
function blankGroup(){return{compensation:'',sizes:Array(MAX_ROWS).fill(''),tCounts:Array(MAX_ROWS).fill(0),reverseFlags:Array(MAX_ROWS).fill(false),visibleCount:BASE_ROWS,specials:[]}}
function number(value){const text=String(value??'').trim();return text===''?NaN:Number(text)}
function normalizeGroup(g){const b=blankGroup(),sizes=Array.isArray(g?.sizes)?g.sizes.slice(0,MAX_ROWS).map(v=>v==null?'':String(v)):b.sizes,tCounts=Array.isArray(g?.tCounts)?g.tCounts.slice(0,MAX_ROWS).map(v=>[0,1,2].includes(Number(v))?Number(v):0):b.tCounts,reverseFlags=Array.isArray(g?.reverseFlags)?g.reverseFlags.slice(0,MAX_ROWS).map(Boolean):b.reverseFlags;while(sizes.length<MAX_ROWS)sizes.push('');while(tCounts.length<MAX_ROWS)tCounts.push(0);while(reverseFlags.length<MAX_ROWS)reverseFlags.push(false);return{compensation:g?.compensation==null?'':String(g.compensation),sizes,tCounts,reverseFlags,visibleCount:Math.min(MAX_ROWS,Math.max(BASE_ROWS,Number(g?.visibleCount)||BASE_ROWS)),specials:Array.isArray(g?.specials)?g.specials.map(s=>({angle:s.angle==null?'90':String(s.angle),radius:s.radius==null||s.radius===''?'0':String(s.radius)})):[]}}
function group(){return groups[memoryIndex]}function rows(){return[...document.querySelectorAll('[data-size-row]')]}function visibleRows(){return rows().filter(r=>!r.hidden)}function visibleInputs(){return visibleRows().map(r=>r.querySelector('.size'))}function filledRows(){return visibleRows().filter(r=>r.querySelector('.size').value.trim())}function foldCount(){return Math.max(0,filledRows().length-1)}function generalFoldCount(){return Math.max(0,foldCount()-filledRows().filter(r=>r.dataset.reverse==='true').length)}
function capture(){if(applying)return;group().compensation=$('compensation').value;group().sizes=rows().map(r=>r.querySelector('.size').value);group().tCounts=rows().map(r=>Number(r.dataset.tCount)||0);group().reverseFlags=rows().map(r=>r.dataset.reverse==='true');group().visibleCount=visibleRows().length}
function apply(){groups[memoryIndex]=normalizeGroup(group());const g=group();applying=true;$('compensation').value=g.compensation;rows().forEach((r,i)=>{r.querySelector('.size').value=g.sizes[i];r.dataset.tCount=String(g.tCounts[i]);r.dataset.reverse=String(g.reverseFlags[i]);r.querySelectorAll('[data-t-count]').forEach(b=>{const active=Number(b.dataset.tCount)===g.tCounts[i];b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const reverseButton=r.querySelector('[data-reverse-toggle]'),reverseActive=g.reverseFlags[i];reverseButton.classList.toggle('active',reverseActive);reverseButton.setAttribute('aria-pressed',String(reverseActive));r.hidden=i>=g.visibleCount});applying=false;$('memoryLabel').textContent='尺寸組 '+(memoryIndex+1)+'／'+COUNT;renderSpecials();$('addWrap').hidden=!rows().some(r=>r.hidden)}
function switchMemory(d){capture();memoryIndex=(memoryIndex+d+COUNT)%COUNT;apply();calculate();setTimeout(()=>visibleInputs()[0]?.focus(),0)}
function addRow(){const r=rows().find(x=>x.hidden);if(!r)return;r.hidden=false;capture();$('addWrap').hidden=!rows().some(x=>x.hidden);renderSpecials();calculate();r.querySelector('.size').focus()}
function setTCount(button){const r=button.closest('[data-size-row]'),selected=String(button.dataset.tCount);r.dataset.tCount=selected;r.querySelectorAll('[data-t-count]').forEach(b=>{const active=String(b.dataset.tCount)===selected;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});capture();calculate()}
function toggleReverse(button){const r=button.closest('[data-size-row]'),active=r.dataset.reverse!=='true';r.dataset.reverse=String(active);button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));capture();renderSpecials();calculate()}
function clearGroup(){groups[memoryIndex]=blankGroup();apply();calculate();visibleInputs()[0]?.focus()}function clearAll(){groups=Array.from({length:COUNT},blankGroup);memoryIndex=0;apply();calculate();visibleInputs()[0]?.focus()}
function fillSelect(select,options,value){select.innerHTML='';options.forEach(o=>{const item=document.createElement('option');item.value=String(o.value??'');item.textContent=String(o.label??o.value??'');select.appendChild(item)});select.value=[...select.options].some(o=>o.value===String(value??''))?String(value??''):'';if(select.id==='thickness')$('thicknessDisplay').textContent=select.selectedOptions[0]?.textContent||''}
function refresh(){applying=true;fillSelect($('material'),coefficients.materialOptions(),context.mat);fillSelect($('thickness'),coefficients.thicknessOptions(context.mat),context.thick);$('defaultRadius').value=context.radius;applying=false}function values(){return coefficients.lookup(context.mat,context.thick)}
function setContext(next){const n=next||{};context.mat=n.mat==null?context.mat:String(n.mat);context.thick=n.thick==null?context.thick:String(n.thick);context.radius=n.radius==null?context.radius:(String(n.radius).trim()||'0');if(context.thick&&!coefficients.hasThickness(context.mat,context.thick))context.thick='';refresh();calculate()}
function notify(){if(window.opener&&!window.opener.closed)window.opener.postMessage({type:'engineering-m-selection',payload:{mat:context.mat,thick:context.thick,radius:context.radius}},location.origin)}
function handleMaterial(){if(applying)return;const old=context.thick;context.mat=$('material').value;context.thick=coefficients.hasThickness(context.mat,old)?old:'';refresh();calculate();notify()}function handleThickness(){if(applying)return;context.thick=$('thickness').value;refresh();calculate();notify()}function handleDefaultRadius(){if(applying)return;context.radius=$('defaultRadius').value;calculate();notify()}
function buildRows(){for(let i=0;i<MAX_ROWS;i++){const label=String(i+1).padStart(2,'0'),r=document.createElement('tr');r.dataset.sizeRow='';r.dataset.tCount='0';r.dataset.reverse='false';if(i>=BASE_ROWS)r.hidden=true;r.innerHTML='<th scope="row" class="size-heading">料內尺寸<span class="zero-value">0T＝－</span></th><td class="t-cell"><div class="t-toggle" role="group" aria-label="尺寸 '+label+' 換算與折彎類型"><button type="button" class="active" data-t-count="0" aria-pressed="true">0T</button><button type="button" data-t-count="1" aria-pressed="false">1T</button><button type="button" data-t-count="2" aria-pressed="false">2T</button><button type="button" class="reverse-toggle" data-reverse-toggle aria-pressed="false">反折</button></div></td><td><input class="size" type="number" inputmode="decimal" step="any" autocomplete="off" aria-label="料內尺寸 '+label+'"></td>';$('calcRows').appendChild(r)}}
function specialValue(s,v){const a=number(s.angle),radius=number(s.radius);if(!Number.isFinite(a)||a<=0||!Number.isFinite(radius)||radius<0)return NaN;if(radius===0)return v.m*a/90;if(!Number.isFinite(v.kf))return NaN;return Math.PI*a*(radius+number(context.thick)*v.kf)/180}
function defaultM(v){const radius=number(context.radius),t=number(context.thick);if(!Number.isFinite(radius)||radius<0)return NaN;if(radius===0)return v.m;if(!Number.isFinite(t)||!Number.isFinite(v.kf))return NaN;return Math.PI*90*(radius+t*v.kf)/180}
function renderSpecials(){const folds=generalFoldCount();group().specials=group().specials.slice(0,folds);if(!group().specials.length){$('specialRows').innerHTML='<div class="special-empty">未設定變化，一般折以90°及上方內R計算</div>';return}$('specialRows').innerHTML='';group().specials.forEach((s,i)=>{const r=document.createElement('div');r.className='special-row';r.innerHTML='<label class="special-field angle-field"><span>角度＝</span><input type="number" inputmode="decimal" step="any" value="'+s.angle+'" aria-label="折彎角度"></label><label class="special-field radius-field"><span>內R＝</span><input type="number" inputmode="decimal" step="any" min="0" value="'+s.radius+'" aria-label="折彎內R"></label><div class="special-field coefficient-field"><span>係數變化＝</span><span class="special-coeff">－</span></div><button type="button" class="special-remove" aria-label="清除此變化">清除此變化</button>';const angle=r.querySelector('[aria-label="折彎角度"]'),radius=r.querySelector('[aria-label="折彎內R"]');angle.oninput=()=>{s.angle=angle.value;calculate()};radius.oninput=()=>{s.radius=radius.value;calculate()};r.querySelector('.special-remove').onclick=()=>{group().specials.splice(i,1);renderSpecials();calculate()};$('specialRows').appendChild(r)})}
function addSpecial(){capture();const folds=generalFoldCount();if(!folds||group().specials.length>=folds){calculate();return}group().specials.push({angle:'90',radius:'0'});renderSpecials();calculate()}
function calculate(){capture();const v=values(),t=number(context.thick),m=defaultM(v),reverseM=Number.isFinite(t)&&Number.isFinite(v.f)?2*t-v.f:NaN,radius=number(context.radius),compRaw=$('compensation').value.trim(),comp=compRaw===''?0:Number(compRaw);$('mMetric').textContent='M '+(Number.isFinite(m)?compact2.format(m):'－');$('reverseMMetric').textContent='反折M '+(Number.isFinite(reverseM)?compact2.format(reverseM):'－');$('kfMetric').textContent='K-F '+(Number.isFinite(v.kf)?compact2.format(v.kf):'－');const entries=visibleRows().map(r=>{const raw=r.querySelector('.size').value.trim(),value=Number(raw),tc=Number(r.dataset.tCount)||0;return{row:r,raw,value,zero:value-tc*(t+radius),reverse:r.dataset.reverse==='true'}}).filter(e=>e.raw);entries.forEach(e=>e.row.querySelector('.zero-value').textContent='0T＝'+(Number.isFinite(e.zero)?compact2.format(e.zero):'－'));visibleRows().filter(r=>!r.querySelector('.size').value.trim()).forEach(r=>r.querySelector('.zero-value').textContent='0T＝－');const valid=entries.filter(e=>Number.isFinite(e.value)&&e.value>0&&Number.isFinite(e.zero)&&e.zero>0),folds=Math.max(0,valid.length-1),reverseFolds=valid.filter(e=>e.reverse).length,normalFolds=folds-reverseFolds;group().specials=group().specials.slice(0,Math.max(0,normalFolds));const specials=group().specials;let total=Number.isFinite(m)&&(!reverseFolds||Number.isFinite(reverseM))?m*Math.max(0,normalFolds)+(Number.isFinite(reverseM)?reverseM*reverseFolds:0):NaN,error='';specials.forEach((s,i)=>{const angle=number(s.angle),specialRadius=number(s.radius),val=specialValue(s,v),r=$('specialRows').children[i];if(r?.querySelector('.special-coeff'))r.querySelector('.special-coeff').textContent=Number.isFinite(val)?compact2.format(val):'－';if(!Number.isFinite(angle)||angle<=0)error=error||'角度必須大於0';else if(!Number.isFinite(specialRadius)||specialRadius<0)error=error||'內R必須為0或正數';else if(!Number.isFinite(val))error=error||'目前條件無法計算折R係數';else if(Number.isFinite(total))total+=val-m});$('folds').text
