*{box-sizing:border-box}

.page{width:100%;display:flex;justify-content:center;align-items:flex-start;background:#fff}
.stage{position:relative;width:min(100vw,1039px);aspect-ratio:1039/726;overflow:hidden;background:#fff}

.field input{width:100%;height:24px;padding:1px 3px;border:1px solid #999;border-radius:4px;outline:none;background:rgba(255,255,255,.96);color:#111;font-size:12px;text-align:center}
.field input:focus{border-color:#ff00b8}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media(max-width:600px){
  .controls{top:8px;width:156px;padding:4px 5px 5px;gap:4px}
  .controls-left{left:8px}
  .controls-right{right:8px}
  .field label{font-size:8px}
  .field input{height:22px;font-size:11px}
  .pink{stroke-width:6}
}
</style>

    <div class="controls controls-left">
      <div class="field"><label for="xInput">X (mm)</label><input id="xInput" type="number" step="any" inputmode="decimal" value="50"></div>
      <div class="field"><label for="wInput">W (mm)</label><input id="wInput" type="number" step="any" inputmode="decimal" value="10"></div>
      <div class="field"><label for="zLeftInput">Z (mm)</label><input id="zLeftInput" type="number" step="any" inputmode="decimal" value="0"></div>
    </div>

    <div class="controls controls-right">
      <div class="field"><label for="yInput">Y (mm)</label><input id="yInput" type="number" step="any" inputmode="decimal" value="50"></div>
      <div class="field"><label for="zInput">Z (mm)</label><input id="zInput" type="number" step="any" inputmode="decimal" value="10"></div>
      <div class="field"><label for="wRightInput">W (mm)</label><input id="wRightInput" type="number" step="any" inputmode="decimal" value="0"></div>

<script>
(() => {
  "use strict";

  // ============================================================
  // 本張「彎刀_117」重新量測的校正參數
  // 圖片實際尺寸：1039 × 726
  // 白線到下一條白線 = 10 mm；綠色虛線位於中間 = 5 mm
  // ============================================================
  const OriginLeft  = { x: 505, y: 610 };
  const X10         = { x: 476, y: 581 };
  const W10         = { x: 534, y: 581 };
  const LeftZ10     = { x: 563, y: 610 };

  const OriginRight = { x: 505, y: 610 };
  const Y10         = { x: 534, y: 581 };
  const Z10         = { x: 476, y: 581 };
  const RightW10    = { x: 447, y: 610 };

  const vec = (a,b) => ({x:b.x-a.x,y:b.y-a.y});
  const half = v => ({x:v.x/2,y:v.y/2});

  const X5Vec      = half(vec(OriginLeft, X10));
  const W5Vec      = half(vec(OriginLeft, W10));
  const LeftZ5Vec  = half(vec(W10, LeftZ10));

  const Y5Vec      = half(vec(OriginRight, Y10));
  const Z5Vec      = half(vec(OriginRight, Z10));
  const RightW5Vec = half(vec(Z10, RightW10));

  const xInput       = document.getElementById("xInput");
  const wInput       = document.getElementById("wInput");
  const zLeftInput   = document.getElementById("zLeftInput");
  const yInput       = document.getElementById("yInput");
  const zInput       = document.getElementById("zInput");
  const wRightInput  = document.getElementById("wRightInput");

  const leftW  = document.getElementById("leftW");
  const leftZ  = document.getElementById("leftZ");
  const rightZ = document.getElementById("rightZ");
  const rightW = document.getElementById("rightW");

  const n = v => {
    const num = parseFloat(v);
    return Number.isFinite(num) ? num : 0;
  };

  const setLine = (el,a,b) => {
    el.setAttribute("x1", a.x.toFixed(3));
    el.setAttribute("y1", a.y.toFixed(3));
    el.setAttribute("x2", b.x.toFixed(3));
    el.setAttribute("y2", b.y.toFixed(3));
  };

  const addScaled = (p,v,mm) => ({
    x: p.x + (mm/5) * v.x,
    y: p.y + (mm/5) * v.y
  });

  function updateLeft() {
    const X = n(xInput.value);
    const W = n(wInput.value);
    const Z = n(zLeftInput.value);

    const start = addScaled(OriginLeft, X5Vec, X);
    const endW  = addScaled(start, W5Vec, W);
    const endZ  = addScaled(endW, LeftZ5Vec, Z);

    setLine(leftW, start, endW);
    setLine(leftZ, endW, endZ);
  }

  function updateRight() {
    const Y = n(yInput.value);
    const Z = n(zInput.value);
    const W = n(wRightInput.value);

    const start = addScaled(OriginRight, Y5Vec, Y);
    const endZ  = addScaled(start, Z5Vec, Z);
    const endW  = addScaled(endZ, RightW5Vec, W);

    setLine(rightZ, start, endZ);
    setLine(rightW, endZ, endW);
  }

  [xInput,wInput,zLeftInput].forEach(el => el.addEventListener("input", updateLeft));
  [yInput,zInput,wRightInput].forEach(el => el.addEventListener("input", updateRight));

  updateLeft();
  updateRight();
})();
</script>
