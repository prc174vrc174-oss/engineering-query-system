<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>尖刀 座標互動定位</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:Arial,"Microsoft JhengHei",sans-serif}
.page{width:100%;display:flex;justify-content:center;align-items:flex-start;background:#fff}
.stage{position:relative;width:min(100vw,1039px);aspect-ratio:1039/726;overflow:hidden;background:#fff}
.stage>img,.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>img{object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage>svg{pointer-events:none}
.pink{stroke:#ff00b8;stroke-width:7;stroke-linecap:round;vector-effect:non-scaling-stroke}
.controls{position:absolute;top:16px;width:170px;padding:5px 6px 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;border:1px solid rgba(0,0,0,.28);border-radius:7px;background:rgba(255,255,255,.86);color:#111;z-index:3}
.controls-left{left:16px}
.controls-right{right:16px}
.field{min-width:0}
.field label{display:block;margin:0 0 3px;font-size:9px;line-height:1;color:#333;white-space:nowrap}
.field input{width:100%;height:24px;padding:1px 3px;border:1px solid #999;border-radius:4px;outline:none;background:rgba(255,255,255,.96);color:#111;font-size:12px;text-align:center}
.field input:focus{border-color:#ff00b8}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@media(max-width:600px){
  .controls{top:8px;width:156px;padding:4px 5px 5px;gap:4px}
  .controls-left{left:8px} .controls-right{right:8px}
  .field label{font-size:8px} .field input{height:22px;font-size:11px}
  .pink{stroke-width:6}
}
</style>
</head>

    <svg viewBox="0 0 1039 726" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <line id="leftW" class="pink"></line>
      <line id="leftZ" class="pink"></line>
      <line id="rightZ" class="pink"></line>
      <line id="rightW" class="pink"></line>
    </svg>

    <div class="controls controls-left">
      <div class="field"><label for="xInput">X (mm)</label><input id="xInput" type="number" step="any" inputmode="decimal" value="50"></div>
      <div class="field"><label for="wInput">W (mm)</label><input id="wInput" type="number" step="any" inputmode="decimal" value="10"></div>
      <div class="field"><label for="zLeftInput">Z (mm)</label><input id="zLeftInput" type="number" step="any" inputmode="decimal" value="0"></div>
    </div>

    <div class="controls controls-right">
      <div class="field"><label for="yInput">Y (mm)</label><input id="yInput" type="number" step="any" inputmode="decimal" value="50"></div>
      <div class="field"><label for="zInput">Z (mm)</label><input id="zInput" type="number" step="any" inputmode="decimal" value="10"></div>
      <div class="field"><label for="wRightInput">W (mm)</label><input id="wRightInput" type="number" step="any" inputmode="decimal" value="0"></div>
    </div>
  </div>
</div>
<script>
(()=>{"use strict";
// =============================================================
// 尖刀.png 專用校正值（重新依本張圖片實際白色格線量測）
// 圖片尺寸：1039 × 726 px
// 10 mm 白線格距：沿兩組實際格線皆為約 29 px / 29 px
// =============================================================
const OriginLeft  = {x:505, y:608};
const X10         = {x:476, y:579};
const W10         = {x:534, y:579};
const LeftZ10     = {x:563, y:608};

const OriginRight = {x:505, y:608};
const Y10         = {x:534, y:579};
const Z10         = {x:476, y:579};
const RightW10    = {x:447, y:608};

const vec=(a,b)=>({x:b.x-a.x,y:b.y-a.y});
const half=v=>({x:v.x/2,y:v.y/2});
const X5Vec      = half(vec(OriginLeft,X10));
const W5Vec      = half(vec(OriginLeft,W10));
const LeftZ5Vec  = half(vec(W10,LeftZ10));
const Y5Vec      = half(vec(OriginRight,Y10));
const Z5Vec      = half(vec(OriginRight,Z10));
const RightW5Vec = half(vec(Z10,RightW10));

const $=id=>document.getElementById(id);
const n=v=>{const z=parseFloat(v);return Number.isFinite(z)?z:0};
const setLine=(el,a,b)=>{
  el.setAttribute('x1',a.x.toFixed(3)); el.setAttribute('y1',a.y.toFixed(3));
  el.setAttribute('x2',b.x.toFixed(3)); el.setAttribute('y2',b.y.toFixed(3));
};
const add=(p,v,k)=>({x:p.x+v.x*k,y:p.y+v.y*k});

function updateLeft(){
  const X=n($('xInput').value), W=n($('wInput').value), Z=n($('zLeftInput').value);
  const start=add(OriginLeft,X5Vec,X/5);
  const endW =add(start,W5Vec,W/5);
  const endZ =add(endW,LeftZ5Vec,Z/5);
  setLine($('leftW'),start,endW);
  setLine($('leftZ'),endW,endZ);
}

function updateRight(){
  const Y=n($('yInput').value), Z=n($('zInput').value), W=n($('wRightInput').value);
  const start=add(OriginRight,Y5Vec,Y/5);
  const endZ =add(start,Z5Vec,Z/5);
  const endW =add(endZ,RightW5Vec,W/5);
  setLine($('rightZ'),start,endZ);
  setLine($('rightW'),endZ,endW);
}

['xInput','wInput','zLeftInput'].forEach(id=>$(id).addEventListener('input',updateLeft));
['yInput','zInput','wRightInput'].forEach(id=>$(id).addEventListener('input',updateRight));
updateLeft(); updateRight();
})();
</script>
